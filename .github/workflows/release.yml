name: OMP2 ARM64 Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create on this fork
        required: true
        type: string
        default: omp2-preview-20261012

permissions:
  contents: read

env:
  # audiopus_sys vendors an older Opus CMake project; CMake 4 requires an
  # explicit policy floor for its pre-3.5 minimum declaration.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: omp2-aarch64-apple-darwin.tar.gz
            python_config: vendor/python-release/pyo3-config.txt
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: omp2-aarch64-unknown-linux-gnu.tar.gz
            python_config: vendor/python/pyo3-config.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install lld uv zstd ninja just
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y pipx zstd ninja-build pkg-config clang libclang-dev libpipewire-0.3-dev libasound2-dev
            command -v uv >/dev/null || pipx install uv
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Install just on Linux
        if: runner.os == 'Linux'
        run: cargo install --locked --version 1.58.0 just
      - name: Prepare embedded Python
        run: just setup-python
      - name: Build OMP
        run: just build-release "${{ matrix.python_config }}"
      - name: Verify Linux extended-attribute preservation
        if: runner.os == 'Linux'
        env:
          PYO3_CONFIG_FILE: ${{ github.workspace }}/${{ matrix.python_config }}
        run: cargo test --release --locked -p omp-shell-builtins --lib support::xattr::tests
      - name: Smoke test and package
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          ./target/release/omp --version
          ./target/release/omp --help >/dev/null
          mkdir -p dist/package
          install -m 0755 target/release/omp dist/package/omp2
          cp LICENSE THIRD-PARTY-NOTICES.txt dist/package/
          cp crates/py/THIRD-PARTY-NOTICES.txt dist/package/PYTHON-THIRD-PARTY-NOTICES.txt
          printf 'commit=%s\ntarget=%s\n' "$GITHUB_SHA" "$TARGET" > dist/package/BUILD.txt
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd dist/package/omp2
          else
            otool -L dist/package/omp2
          fi
          tar -czf "dist/${ASSET}" -C dist/package .
          (cd dist && shasum -a 256 "${ASSET}" > "${ASSET}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OMP2 preview ${{ inputs.tag }}
          prerelease: true
          make_latest: false
          body: |
            OMP2 预发布测试构建，来自本 fork 的发行分支；可能存在破坏性变化。

            提供 macOS ARM64 与 Linux ARM64 压缩安装包、许可证、构建版本及 SHA-256 校验文件。解压后将 `omp2` 放入 PATH，不会替换现有 `omp`。Linux 包基于 Ubuntu 24.04 构建。
          files: |
            dist/omp2-aarch64-apple-darwin.tar.gz
            dist/omp2-aarch64-apple-darwin.tar.gz.sha256
            dist/omp2-aarch64-unknown-linux-gnu.tar.gz
            dist/omp2-aarch64-unknown-linux-gnu.tar.gz.sha256
